# Local dev stack: LocalStack (S3/SQS/DynamoDB) + cognito-local (Cognito
# emulation -- LocalStack's own Cognito support is Pro-only, see
# PLANS/phase-1.md §4) + backend (uvicorn, hot reload). The client is the
# Expo app in `mobile/`, run separately via `cd mobile && npx expo start` --
# not part of this compose stack (issue #10 dropped the Next.js `frontend`
# service this file used to run under a `ui` profile).
services:
  localstack:
    # Pinned: newer LocalStack tags gate startup behind a Pro auth token even
    # for community-only SERVICES (s3/sqs/dynamodb); this tag runs unlicensed.
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  cognito-local:
    image: jagregory/cognito-local:latest
    ports:
      - "9229:9229"
    volumes:
      # cognito-local's own default (UsernameAttributes: ["email"]) would
      # make every AdminCreateUser/SignUp reject a plain username -- this
      # overrides it to match the real pool (username-only, no aliases).
      # Read-write: cognito-local persists pool/user state back into this
      # same file (it's both its config and its datastore).
      - ./local/cognito-local-config.json:/app/.cognito/config.json

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - GIT_SHA=local
      - LOG_LEVEL=DEBUG
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - TABLE_NAME=bookloud-local
      - PDF_BUCKET=bookloud-local-pdfs
      - AUDIO_BUCKET=bookloud-local-audio
      - MARKS_BUCKET=bookloud-local-marks
      - EXTRACT_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-extract
      # Used by the API as of phase 6: POST /books/{id}/resynthesize publishes
      # the fan-out for the chunks it rewinds, and publishes directly to the
      # stitch queue in the zero-failed-chunk (STITCH_FAILED) branch, where no
      # chunk will ever increment again. (These were previously here "for
      # symmetry"; they are load-bearing now.)
      - SYNTHESIZE_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-synthesize
      - STITCH_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-stitch
      # generate_presigned_post signs URLs against the client's own endpoint
      # (AWS_ENDPOINT_URL, i.e. http://localstack:4566 inside compose) --
      # unreachable from the browser on the host. This override makes
      # presigned upload URLs host-reachable (PLANS/phase-3.md §9.4) -- and,
      # as of phase 6, presigned *download* URLs too: GET /books/{id}/audio
      # signs with the same client, and the failure mode is silent (the URL is
      # well-formed and correctly signed, the browser just cannot connect).
      # See PLANS/phase-6.md §4.2.
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:4566
      # Used only by local/cognito_bootstrap.py (run inside this container --
      # it already has boto3), not by the app itself: the backend never
      # talks to Cognito directly (see PLANS/phase-1.md §1).
      - COGNITO_ENDPOINT_URL=http://cognito-local:9229
    volumes:
      - ./backend:/app
      - ./local:/local-shared
    depends_on:
      localstack:
        condition: service_healthy
      cognito-local:
        condition: service_started

  chat:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "src.chat_app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=local
      - GIT_SHA=local
      - LOG_LEVEL=DEBUG
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - TABLE_NAME=bookloud-local
      - PDF_BUCKET=bookloud-local-pdfs
      - AUDIO_BUCKET=bookloud-local-audio
      - MARKS_BUCKET=bookloud-local-marks
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      # cognito_local uses endpoint URL directly
      - COGNITO_ENDPOINT_URL=http://cognito-local:9229
      # S3_PUBLIC_ENDPOINT_URL might not be strictly needed for chat but good to have
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:4566
    volumes:
      - ./backend:/app
      - ./local:/local-shared
    depends_on:
      localstack:
        condition: service_healthy
      cognito-local:
        condition: service_started

  # Runs the same handle_records the extract Lambda's `handler` calls, in a
  # poll loop against LocalStack's SQS instead of a real event source mapping
  # -- LocalStack community can't run our container-image Lambda (PLANS/
  # phase-3.md §9.2). Now also a SynthesisQueue producer (phase 4): it
  # publishes the fan-out to bookloud-local-synthesize after each EXTRACTED
  # flip.
  extract-worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      - ENVIRONMENT=local
      - GIT_SHA=local
      - LOG_LEVEL=DEBUG
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - TABLE_NAME=bookloud-local
      - PDF_BUCKET=bookloud-local-pdfs
      - EXTRACT_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-extract
      - SYNTHESIZE_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-synthesize
    volumes:
      - ./backend:/app
    command: ["uv", "run", "python", "-m", "src.contexts.library.interface.local_extract_worker"]
    depends_on:
      localstack:
        condition: service_healthy

  # Runs the same handle_records the synthesize Lambda's `handler` calls, in
  # a poll loop against LocalStack's SQS (PLANS/phase-4.md §9.2). ENVIRONMENT
  # is deliberately "local" here (not "prod"): get_speech_synthesizer() (§0)
  # never returns a real engine, so no external service is ever contacted.
  # No GOOGLE_TTS_SECRET_NAME here for the same reason.
  #
  # SYNTHESIS_STUB_MODE=silent (PLANS/phase-5.md OQ-1) picks the *local,
  # network-free* SilentSynthesizer over the raise-only StubSynthesizer, so
  # `make up` produces real (silent) MPEG-2 frames and the phase-5 stitcher
  # actually concatenates bytes, computes byte offsets and runs a real
  # multipart upload against LocalStack's S3. This is the ONLY place this
  # variable is set -- never on a PR stack, and it is ignored in prod because
  # the environment gate is checked first regardless.
  synthesize-worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      - ENVIRONMENT=local
      - GIT_SHA=local
      - LOG_LEVEL=DEBUG
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - TABLE_NAME=bookloud-local
      - AUDIO_BUCKET=bookloud-local-audio
      - MARKS_BUCKET=bookloud-local-marks
      - SYNTHESIZE_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-synthesize
      - SYNTHESIZE_MAX_RECEIVE_COUNT=5
      # This worker is now also a StitchQueue producer: it publishes the
      # fan-in message when its increment is the one that completes the book.
      - STITCH_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-stitch
      - SYNTHESIS_STUB_MODE=silent
    volumes:
      - ./backend:/app
    command: ["uv", "run", "python", "-m", "src.contexts.library.interface.local_synthesize_worker"]
    depends_on:
      localstack:
        condition: service_healthy

  # Runs the same handle_records the stitch Lambda's `handler` calls, in a
  # poll loop against LocalStack's SQS (PLANS/phase-5.md §9.2). With
  # SYNTHESIS_STUB_MODE=silent on the synthesize-worker above, this worker's
  # steady state is a REAL stitch: it concatenates silent MPEG-2 frames into
  # audio/<u>/<b>/book.mp3 via a real multipart upload and writes a
  # marks/<u>/<b>/book.json with real byte offsets, ending at READY.
  #
  # Drop SYNTHESIS_STUB_MODE and the steady state becomes the zero-segment
  # stitch instead -- book -> PARTIAL/NO_AUDIO with a real book.json and no
  # book.mp3. That is the deterministic contract every PR stack gets, not a
  # bug (PLANS/phase-5.md §3.2).
  stitch-worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      - ENVIRONMENT=local
      - GIT_SHA=local
      - LOG_LEVEL=DEBUG
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - TABLE_NAME=bookloud-local
      - AUDIO_BUCKET=bookloud-local-audio
      - MARKS_BUCKET=bookloud-local-marks
      - STITCH_QUEUE_URL=http://localstack:4566/000000000000/bookloud-local-stitch
      - STITCH_MAX_RECEIVE_COUNT=3
    volumes:
      - ./backend:/app
    command: ["uv", "run", "python", "-m", "src.contexts.library.interface.local_stitch_worker"]
    depends_on:
      localstack:
        condition: service_healthy
