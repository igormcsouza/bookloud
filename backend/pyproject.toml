[project]
name = "bookloud-backend"
version = "0.1.1"
description = "Bookloud backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "boto3>=1.35",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24,<2",
    "edge-tts>=7.0,<8",
    "pyjwt[crypto]>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov=lambda_function --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
    # mangum still calls asyncio.get_event_loop() in its adapter; nothing to
    # fix on our side until upstream does.
    "ignore:There is no current event loop:DeprecationWarning:mangum",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.uv]
package = false
