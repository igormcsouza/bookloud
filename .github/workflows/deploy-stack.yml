name: Deploy Stack

# Reusable workflow factoring the "push code -> CDK deploy backend -> smoke
# test -> (optional) Playwright e2e" sequence shared by deploy-pr.yml
# (ephemeral pr-N environments) and deploy-prod.yml (the ephemeral staging
# environment gate, and the prod deploy itself).
#
# Issue #10: the frontend build/deploy steps this workflow used to run
# (OpenNext build, `BookloudFrontend-*` CDK deploy, frontend URL output) are
# gone -- the Next.js frontend they built is gone too, replaced by the Expo
# Android app in `mobile/`, which is not part of this deploy pipeline (it
# builds separately, via mobile-release.yml, on GitHub release). PR/staging
# environments deploy backend only; mobile testing points a local `expo
# start` dev client at this stack's API URL. The Playwright e2e step below
# is likewise gone -- it exercised the frontend, which no longer exists; a
# mobile e2e replacement (Detox/Maestro) is an explicitly deferred follow-up
# to issue #10, not part of it.
#
# Phase 8 (IMPLEMENTATION_PLAN.md): deploy-pr.yml and deploy-prod.yml used to
# carry this sequence duplicated byte-for-byte, deliberately so (see the old
# comment in deploy-prod.yml) until there was a second real caller that
# needed it with different knobs -- the staging gate below is that caller.
# Do not re-duplicate this again; add an input instead.
#
# `seed_users` provisions throwaway Cognito credentials the (login-gated)
# smoke test uses -- prod deploys leave it off.

on:
  workflow_call:
    inputs:
      env_name:
        description: 'Stack-name / ENV_NAME suffix, e.g. "pr-42", "staging", "prod".'
        required: true
        type: string
      aws_region:
        description: >-
          AWS region to deploy into, as a literal string (e.g. "us-east-1").
          `with:` on a `uses:` reusable-workflow call cannot read the secrets
          context, so callers pass the region directly instead of a secrets
          lookup -- prod passes "sa-east-1", PR/staging pass "us-east-1".
          Issue #8.
        required: true
        type: string
      environment_name:
        description: "GitHub Environment used for the deployment (protection rules / secrets)."
        required: false
        type: string
        default: development
      seed_users:
        description: >-
          Provision throwaway Cognito users (login + NEW_PASSWORD_REQUIRED +
          fixed-credential admin) for the smoke test and e2e suite to use.
          Prod deploys leave this off -- no reason to provision extra users in
          the real user pool.
        required: false
        type: boolean
        default: true
    outputs:
      api_url:
        value: ${{ jobs.deploy.outputs.api_url }}
      chat_url:
        value: ${{ jobs.deploy.outputs.chat_url }}
      user_pool_id:
        value: ${{ jobs.deploy.outputs.user_pool_id }}
      user_pool_client_id:
        value: ${{ jobs.deploy.outputs.user_pool_client_id }}
      extract_function_name:
        value: ${{ jobs.deploy.outputs.extract_function_name }}
      synthesize_function_name:
        value: ${{ jobs.deploy.outputs.synthesize_function_name }}
      stitch_function_name:
        value: ${{ jobs.deploy.outputs.stitch_function_name }}
      login_username:
        value: ${{ jobs.deploy.outputs.login_username }}
      login_password:
        value: ${{ jobs.deploy.outputs.login_password }}
      newuser_username:
        value: ${{ jobs.deploy.outputs.newuser_username }}
      newuser_temp_password:
        value: ${{ jobs.deploy.outputs.newuser_temp_password }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.deploy-backend.outputs.api_url }}
    env:
      ENV_NAME: ${{ inputs.env_name }}
    outputs:
      api_url: ${{ steps.deploy-backend.outputs.api_url }}
      chat_url: ${{ steps.deploy-backend.outputs.chat_url }}
      user_pool_id: ${{ steps.deploy-backend.outputs.user_pool_id }}
      user_pool_client_id: ${{ steps.deploy-backend.outputs.user_pool_client_id }}
      extract_function_name: ${{ steps.deploy-backend.outputs.extract_function_name }}
      synthesize_function_name: ${{ steps.deploy-backend.outputs.synthesize_function_name }}
      stitch_function_name: ${{ steps.deploy-backend.outputs.stitch_function_name }}
      login_username: ${{ steps.seed-users.outputs.login_username }}
      login_password: ${{ steps.seed-users.outputs.login_password }}
      newuser_username: ${{ steps.seed-users.outputs.newuser_username }}
      newuser_temp_password: ${{ steps.seed-users.outputs.newuser_temp_password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only needed for `npm install -g aws-cdk` below -- this job no longer
      # builds a JS project of its own (the mobile app builds separately, via
      # mobile-release.yml), so there's no lockfile here to cache against.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('infra/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK Python dependencies
        working-directory: infra
        run: pip install -r requirements.txt

      - name: Bootstrap CDK
        working-directory: infra
        run: cdk bootstrap "aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ inputs.aws_region }}"

      # --exclusively is load-bearing: without it, naming BookloudApi-* would
      # drag its dependencies in with whatever context the *next* command
      # supplies.
      - name: Deploy Storage, Auth, Pipeline, Api
        id: deploy-backend
        working-directory: infra
        run: |
          cdk deploy \
            "BookloudStorage-${ENV_NAME}" "BookloudAuth-${ENV_NAME}" \
            "BookloudPipeline-${ENV_NAME}" "BookloudApi-${ENV_NAME}" \
            --exclusively \
            --require-approval never \
            -c environment="${ENV_NAME}" \
            -c git_sha="${GITHUB_SHA}" \
            --outputs-file cdk-backend-outputs.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open("cdk-backend-outputs.json") as f:
              outputs = json.load(f)
          env_name = os.environ["ENV_NAME"]
          api = outputs.get(f"BookloudApi-{env_name}", {})
          auth = outputs.get(f"BookloudAuth-{env_name}", {})
          pipeline = outputs.get(f"BookloudPipeline-{env_name}", {})
          print(f"api_url={api.get('ApiUrl', '').rstrip('/')}")
          print(f"chat_url={api.get('ChatUrl', '').rstrip('/')}")
          print(f"user_pool_id={auth.get('UserPoolId', '')}")
          print(f"user_pool_client_id={auth.get('UserPoolClientId', '')}")
          # The smoke test invokes these directly instead of waiting on their
          # own EventBridge Rule schedule (infra/stacks/pipeline_stack.py's
          # _add_scheduled_pollers) -- see local/smoke_test.py's docstring.
          print(f"extract_function_name={pipeline.get('ExtractFunctionName', '')}")
          print(f"synthesize_function_name={pipeline.get('SynthesizeFunctionName', '')}")
          print(f"stitch_function_name={pipeline.get('StitchFunctionName', '')}")
          PY

      # Self-signup is disabled on the pool (admin-only provisioning, see
      # PLANS/phase-1.md §11) -- Cognito itself rejects SignUp, so the smoke
      # test can't create its own users. Seed two throwaway ones the way an
      # admin actually would: a normal permanent-password login, and a
      # temp-password one to exercise the NEW_PASSWORD_REQUIRED challenge.
      # Both live only in this stack's pool and vanish with it on teardown.
      #
      # Skipped entirely when seed_users is false (the prod deploy): no
      # reason to provision extra users in the real user pool, and prod's
      # smoke test / e2e never run the login-gated checks anyway.
      - name: Seed smoke-test users
        id: seed-users
        if: inputs.seed_users
        env:
          USER_POOL_ID: ${{ steps.deploy-backend.outputs.user_pool_id }}
        run: |
          LOGIN_USER="smoke-login-${GITHUB_RUN_ID}"
          LOGIN_PASS="Smoke-$(openssl rand -hex 8)!A1"
          NEWUSER="smoke-newuser-${GITHUB_RUN_ID}"
          NEWUSER_TEMP_PASS="Temp-$(openssl rand -hex 8)!A1"

          aws cognito-idp admin-create-user \
            --user-pool-id "$USER_POOL_ID" --username "$LOGIN_USER" \
            --message-action SUPPRESS >/dev/null
          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" --username "$LOGIN_USER" \
            --password "$LOGIN_PASS" --permanent >/dev/null

          aws cognito-idp admin-create-user \
            --user-pool-id "$USER_POOL_ID" --username "$NEWUSER" \
            --message-action SUPPRESS >/dev/null
          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" --username "$NEWUSER" \
            --password "$NEWUSER_TEMP_PASS" >/dev/null

          # Fixed-credential user for manually poking at the deployed
          # frontend without digging through AWS -- reviewer login only, not
          # used by the smoke test or e2e. Fine to be predictable: this pool
          # is throwaway (PR) or non-production (staging) and dies with the
          # stack.
          #
          # Unlike the two smoke users above, this username is FIXED, so it
          # survives into every later push to the same PR/staging stack (the
          # pool outlives individual runs; only teardown deletes it).
          # Creation must therefore tolerate "already exists" -- but only
          # that. Any other AdminCreateUser error still fails the job
          # loudly, same principle as the teardown fix in phase 1: never
          # blanket-ignore an AWS error. admin-set-user-password below runs
          # unconditionally either way, so a pre-existing admin still ends
          # up with the advertised password.
          if ! create_err=$(aws cognito-idp admin-create-user \
                --user-pool-id "$USER_POOL_ID" --username "admin" \
                --message-action SUPPRESS 2>&1 >/dev/null); then
            case "$create_err" in
              *UsernameExistsException*)
                echo "admin user already exists in this stack's pool -- resetting its password" ;;
              *)
                echo "$create_err" >&2; exit 1 ;;
            esac
          fi
          aws cognito-idp admin-set-user-password \
            --user-pool-id "$USER_POOL_ID" --username "admin" \
            --password "password" --permanent >/dev/null

          {
            echo "login_username=${LOGIN_USER}"
            echo "login_password=${LOGIN_PASS}"
            echo "newuser_username=${NEWUSER}"
            echo "newuser_temp_password=${NEWUSER_TEMP_PASS}"
          } >> "$GITHUB_OUTPUT"

      # Login-gated checks (Cognito auth, upload/extract/synthesize/stitch)
      # only run when seed_users provisioned credentials for them -- prod
      # never runs them (unchanged from every prior phase: real TTS engines
      # are prod-only, so this smoke test intentionally never drives real
      # synthesis against real infra).
      - name: Smoke test (full, with login) the deployed stack
        if: inputs.seed_users
        run: |
          python3 local/smoke_test.py \
            --api-url "${{ steps.deploy-backend.outputs.api_url }}" \
            --chat-url "${{ steps.deploy-backend.outputs.chat_url }}" \
            --expect-commit "${{ github.sha }}" \
            --expect-environment "${{ env.ENV_NAME }}" \
            --cognito-client-id "${{ steps.deploy-backend.outputs.user_pool_client_id }}" \
            --cognito-region "${{ inputs.aws_region }}" \
            --login-username "${{ steps.seed-users.outputs.login_username }}" \
            --login-password "${{ steps.seed-users.outputs.login_password }}" \
            --newuser-username "${{ steps.seed-users.outputs.newuser_username }}" \
            --newuser-temp-password "${{ steps.seed-users.outputs.newuser_temp_password }}" \
            --extract-function-name "${{ steps.deploy-backend.outputs.extract_function_name }}" \
            --synthesize-function-name "${{ steps.deploy-backend.outputs.synthesize_function_name }}" \
            --stitch-function-name "${{ steps.deploy-backend.outputs.stitch_function_name }}"

      - name: Smoke test (minimal) the deployed stack
        if: ${{ !inputs.seed_users }}
        run: |
          python3 local/smoke_test.py \
            --api-url "${{ steps.deploy-backend.outputs.api_url }}" \
            --chat-url "${{ steps.deploy-backend.outputs.chat_url }}" \
            --expect-commit "${{ github.sha }}" \
            --expect-environment "${{ env.ENV_NAME }}"
