name: Destroy PR Environment

on:
  pull_request:
    types: [closed] # fires for both merged and closed-without-merge
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-env-${{ github.event.pull_request.number }} # same group as deploy: queue behind it
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy pr-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 60 # CloudFront distribution deletion dominates; budget ~15-25 min
    environment: development
    env:
      ENV_NAME: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Stack names are deterministic, so plain CloudFormation deletes are
      # enough -- no checkout, CDK synth, or frontend build needed. Reverse
      # dependency order: Frontend -> Api -> Pipeline -> Auth -> Storage.
      - name: Delete stacks (reverse dependency order)
        run: |
          set -euo pipefail

          # --- bounded DELETE_FAILED retry (PLANS/phase-6.md §16 addendum) ---
          #
          # Two of the last three destroy-pr runs failed identically:
          # HttpApiCognitoAuthorizer returning `HandlerErrorCode:
          # InternalFailure` on delete, stranding four pr-N stacks each time
          # and needing manual cleanup with elevated credentials.
          #
          # The pr-6 post-mortem established that CloudFormation ordered the
          # deletion correctly (every route reached DELETE_COMPLETE before the
          # authorizer was touched) and that the API had zero routes and zero
          # integrations left when the authorizer failed -- so it is neither
          # an ordering bug nor a still-in-use reference. `InternalFailure`
          # carries no service-side reason, so the true cause is not
          # observable from outside the account. It is transient: the
          # identical delete succeeded on a plain rerun for both pr-4 and
          # pr-6, with no code change either time.
          #
          # HONEST LIMITATION, stated because it decides how much this is
          # worth: **both observed recoveries came HOURS later, not seconds.**
          # A tight retry loop that burned its whole budget in 90 seconds
          # would look like a fix and not be one, so the back-off below is
          # deliberately long (60s, 180s, 300s ~= 9 minutes) and still may not
          # be long enough. This retry is a best-effort mitigation; the actual
          # safety net is the loud failure below plus an easy workflow rerun.
          # The other half of the mitigation is in infra/stacks/api_stack.py,
          # which collapsed 25 routes to 5 `ANY` routes so the teardown
          # provokes the failure less hard in the first place.
          #
          # Only DELETE_FAILED is retried. Every other terminal state, and
          # exhausting the retries, fails the job -- the phase-1 fix that made
          # teardown fail rather than skip is what surfaced these leaks at
          # all, and a retry that silently swallowed a real error would
          # recreate the original leak bug.
          BACKOFFS=(60 180 300)
          # Hard cap on total added wall-clock across the whole job, so a
          # doomed teardown cannot sit here burning the 60-minute budget.
          RETRY_BUDGET_SECONDS=900
          RETRY_SPENT=0

          stack_status() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "GONE"
          }

          delete_with_retry() {
            local STACK="$1" ATTEMPT=0 STATUS
            while :; do
              aws cloudformation delete-stack --stack-name "$STACK"
              if aws cloudformation wait stack-delete-complete --stack-name "$STACK"; then
                echo "$STACK deleted."
                return 0
              fi

              STATUS=$(stack_status "$STACK")
              if [ "$STATUS" = "GONE" ]; then
                # The wait can report failure for a stack that is in fact gone
                # (e.g. it finished between poll and describe).
                echo "$STACK is gone."
                return 0
              fi
              if [ "$STATUS" != "DELETE_FAILED" ]; then
                echo "::error::$STACK is in $STATUS, not DELETE_FAILED - not retrying." >&2
                aws cloudformation describe-stack-events --stack-name "$STACK" \
                  --max-items 20 --output table >&2 || true
                return 1
              fi

              if [ "$ATTEMPT" -ge "${#BACKOFFS[@]}" ]; then
                echo "::error::$STACK is still DELETE_FAILED after ${#BACKOFFS[@]} retries." >&2
                echo "::error::This is the KNOWN TRANSIENT AWS::ApiGatewayV2::Authorizer 'InternalFailure' on delete. The stack is STILL STANDING and is leaking resources." >&2
                echo "::error::AWS reports no reason for it and it is not caused by anything in this repo. Both previous occurrences (pr-4, pr-6) deleted cleanly on a plain rerun of this workflow HOURS later, with no code change." >&2
                echo "::error::WHAT TO DO: re-run this workflow later (Actions -> Destroy PR Environment -> Re-run jobs). If it still fails after several hours, delete BookloudApi-${ENV_NAME} by hand with elevated credentials." >&2
                aws cloudformation describe-stack-events --stack-name "$STACK" \
                  --max-items 20 --output table >&2 || true
                return 1
              fi

              local SLEEP="${BACKOFFS[$ATTEMPT]}"
              if [ "$((RETRY_SPENT + SLEEP))" -gt "$RETRY_BUDGET_SECONDS" ]; then
                echo "::error::$STACK is DELETE_FAILED and the ${RETRY_BUDGET_SECONDS}s retry budget for this job is exhausted." >&2
                echo "::error::This is the KNOWN TRANSIENT AWS::ApiGatewayV2::Authorizer 'InternalFailure' on delete. The stack is STILL STANDING. Re-run this workflow later; both previous occurrences cleared on a rerun hours later." >&2
                return 1
              fi
              RETRY_SPENT=$((RETRY_SPENT + SLEEP))
              ATTEMPT=$((ATTEMPT + 1))
              echo "$STACK is DELETE_FAILED (the known transient authorizer InternalFailure)."
              echo "Retry $ATTEMPT/${#BACKOFFS[@]} in ${SLEEP}s (${RETRY_SPENT}s of ${RETRY_BUDGET_SECONDS}s budget used)..."
              sleep "$SLEEP"
            done
          }

          for STACK in "BookloudFrontend-${ENV_NAME}" \
                       "BookloudApi-${ENV_NAME}" \
                       "BookloudPipeline-${ENV_NAME}" \
                       "BookloudAuth-${ENV_NAME}" \
                       "BookloudStorage-${ENV_NAME}"; do
            # Distinguish "stack genuinely doesn't exist" from any other
            # describe-stacks failure (e.g. AccessDenied) -- a permission
            # gap must fail loudly here, not be silently treated as
            # nothing-to-do. (This exact confusion let PR #1's environment
            # leak for a day: the IAM policy didn't cover Bookloud stacks,
            # describe-stacks was denied, and the old `>/dev/null 2>&1`
            # swallowed it into a false "does not exist".)
            if ERR=$(aws cloudformation describe-stacks --stack-name "$STACK" 2>&1 1>/dev/null); then
              echo "Deleting $STACK..."
              delete_with_retry "$STACK"
            elif echo "$ERR" | grep -q "does not exist"; then
              echo "$STACK does not exist - skipping."
            else
              echo "ERROR describing $STACK: $ERR" >&2
              exit 1
            fi
          done

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Environment `pr-${{ github.event.pull_request.number }}` destroyed.',
            });
