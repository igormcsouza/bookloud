name: "One-off: Teardown old us-east-1 prod"

# Temporary, manually-triggered workflow to delete the pre-region-split prod
# stacks left behind in us-east-1 after issue #8 moved prod to sa-east-1.
# CloudFront OriginAccessControl names are account-global (not per-region),
# so the old us-east-1 BookloudFrontend-prod stack's OAC collides with the
# new sa-east-1 stack's attempt to create one with the same derived name --
# this must run before a sa-east-1 prod deploy can succeed.
#
# Confirmed disposable: no important data in the old us-east-1 stacks.
# Delete this workflow file once it has run successfully.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete-us-east-1-prod" to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy old us-east-1 prod stacks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      ENV_NAME: prod

    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "delete-us-east-1-prod" ]; then
            echo "::error::confirm input did not match 'delete-us-east-1-prod' -- aborting."
            exit 1
          fi

      - name: Configure AWS credentials (us-east-1)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Same bounded DELETE_FAILED retry as destroy-pr.yml (known transient
      # AWS::ApiGatewayV2::Authorizer InternalFailure on delete).
      - name: Delete stacks (reverse dependency order)
        run: |
          set -euo pipefail

          BACKOFFS=(60 180 300)
          RETRY_BUDGET_SECONDS=900
          RETRY_SPENT=0

          stack_status() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "GONE"
          }

          delete_with_retry() {
            local STACK="$1" ATTEMPT=0 STATUS
            while :; do
              aws cloudformation delete-stack --stack-name "$STACK"
              if aws cloudformation wait stack-delete-complete --stack-name "$STACK"; then
                echo "$STACK deleted."
                return 0
              fi

              STATUS=$(stack_status "$STACK")
              if [ "$STATUS" = "GONE" ]; then
                echo "$STACK is gone."
                return 0
              fi
              if [ "$STATUS" != "DELETE_FAILED" ]; then
                echo "::error::$STACK is in $STATUS, not DELETE_FAILED - not retrying." >&2
                aws cloudformation describe-stack-events --stack-name "$STACK" \
                  --max-items 20 --output table >&2 || true
                return 1
              fi

              if [ "$ATTEMPT" -ge "${#BACKOFFS[@]}" ]; then
                echo "::error::$STACK is still DELETE_FAILED after ${#BACKOFFS[@]} retries." >&2
                aws cloudformation describe-stack-events --stack-name "$STACK" \
                  --max-items 20 --output table >&2 || true
                return 1
              fi

              local SLEEP="${BACKOFFS[$ATTEMPT]}"
              if [ "$((RETRY_SPENT + SLEEP))" -gt "$RETRY_BUDGET_SECONDS" ]; then
                echo "::error::$STACK is DELETE_FAILED and the ${RETRY_BUDGET_SECONDS}s retry budget is exhausted." >&2
                return 1
              fi
              RETRY_SPENT=$((RETRY_SPENT + SLEEP))
              ATTEMPT=$((ATTEMPT + 1))
              echo "$STACK is DELETE_FAILED. Retry $ATTEMPT/${#BACKOFFS[@]} in ${SLEEP}s..."
              sleep "$SLEEP"
            done
          }

          for STACK in "BookloudFrontend-${ENV_NAME}" \
                       "BookloudApi-${ENV_NAME}" \
                       "BookloudPipeline-${ENV_NAME}" \
                       "BookloudAuth-${ENV_NAME}" \
                       "BookloudStorage-${ENV_NAME}"; do
            if ERR=$(aws cloudformation describe-stacks --stack-name "$STACK" 2>&1 1>/dev/null); then
              echo "Deleting $STACK..."
              delete_with_retry "$STACK"
            elif echo "$ERR" | grep -q "does not exist"; then
              echo "$STACK does not exist - skipping."
            else
              echo "ERROR describing $STACK: $ERR" >&2
              exit 1
            fi
          done

      # storage_stack.py/frontend_stack.py/auth_stack.py all set
      # RemovalPolicy.RETAIN for prod (deliberately, to survive an accidental
      # stack delete) -- deleting the CFN stacks above orphans these
      # resources rather than removing them. Confirmed disposable: no
      # important data. Named explicitly (not discovered by a `bookloud*`
      # prefix scan) so this can never accidentally touch the *new*
      # sa-east-1 prod resources or the live *-staging resources from an
      # in-flight deploy-prod run.
      - name: Delete orphaned RETAIN resources (old us-east-1 prod only)
        run: |
          set -euo pipefail

          for BUCKET in \
            bookloudfrontend-prod-frontendassets13c50fea-noe4rggsijip \
            bookloudstorage-prod-audiobucket96beecba-9w4jwbszsgta \
            bookloudstorage-prod-marksbucketb19e1b3c-2nma4wtocotx \
            bookloudstorage-prod-pdfbucketfa9e115a-gal41rlq6aj7; do
            if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              REGION=$(aws s3api get-bucket-location --bucket "$BUCKET" --query LocationConstraint --output text)
              REGION=${REGION/None/us-east-1}
              if [ "$REGION" != "us-east-1" ]; then
                echo "::error::$BUCKET is in $REGION, not us-east-1 -- refusing to touch it (safety check)." >&2
                exit 1
              fi
              echo "Emptying and deleting $BUCKET ..."
              aws s3 rm "s3://$BUCKET" --recursive
              aws s3api delete-bucket --bucket "$BUCKET"
              echo "$BUCKET deleted."
            else
              echo "$BUCKET does not exist - skipping."
            fi
          done

          if aws dynamodb describe-table --table-name bookloud-prod --region us-east-1 >/dev/null 2>&1; then
            echo "Deleting DynamoDB table bookloud-prod ..."
            aws dynamodb delete-table --table-name bookloud-prod --region us-east-1 >/dev/null
            aws dynamodb wait table-not-exists --table-name bookloud-prod --region us-east-1
            echo "bookloud-prod table deleted."
          else
            echo "bookloud-prod table does not exist - skipping."
          fi

          POOL_ID=us-east-1_dmrLjAH1h
          if aws cognito-idp describe-user-pool --user-pool-id "$POOL_ID" --region us-east-1 >/dev/null 2>&1; then
            NAME=$(aws cognito-idp describe-user-pool --user-pool-id "$POOL_ID" --region us-east-1 --query 'UserPool.Name' --output text)
            if [ "$NAME" != "bookloud-prod" ]; then
              echo "::error::$POOL_ID is named '$NAME', not 'bookloud-prod' -- refusing to delete (safety check)." >&2
              exit 1
            fi
            echo "Deleting Cognito user pool $POOL_ID ($NAME) ..."
            aws cognito-idp delete-user-pool --user-pool-id "$POOL_ID" --region us-east-1
            echo "$POOL_ID deleted."
          else
            echo "$POOL_ID does not exist - skipping."
          fi
