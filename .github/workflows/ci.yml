name: CI

on:
  workflow_call:
    inputs:
      run_e2e:
        description: >-
          Run the full local-compose Playwright suite (with the playback
          project -- docker up, browser+codec install, the heaviest job
          here). deploy-pr.yml's own post-deploy Playwright step (chromium
          only, against the real ephemeral stack) is unaffected by this and
          always runs on a PR; this flag is only about the docker-compose
          e2e-local job, which is expensive enough to reserve for main.
        type: boolean
        default: false

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies (including dev group)
        working-directory: backend
        run: uv sync --group dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest --tb=short

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: npm test

  test-infra:
    name: Infra tests + synth
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('infra/requirements.txt', 'infra/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CDK Python dependencies
        working-directory: infra
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run infra unit tests
        working-directory: infra
        run: pytest tests

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Belt-and-braces synth check
        working-directory: infra
        run: cdk synth -c environment=pr-0 -q
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1

  local-smoke:
    name: Local compose smoke test
    needs: [test-backend, test-frontend, test-infra]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bring up the local stack
        run: make up

      - name: Run the smoke test
        run: make smoke

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: make down

  # Parallel to `local-smoke`, deliberately NOT merged into it: a Playwright
  # failure and a smoke failure mean very different things, and collapsing them
  # into one job would hide which one broke.
  #
  # This is phase 6's real gate (PLANS/phase-6.md §13.4). Local compose is the
  # ONLY environment in existence where a browser test can hear anything --
  # `get_speech_synthesizer()` gates on `ENVIRONMENT != "prod"` first and
  # unconditionally, so in every deployed environment every chunk fails with
  # EXTERNAL_TTS_DISABLED and `audioKey` is null. `SYNTHESIS_STUB_MODE=silent`
  # (compose's synthesize-worker, and nowhere else) is what makes
  # playback.spec.ts possible at all. Since deploy-pr.yml's `ci` job calls this
  # workflow, every PR runs it.
  e2e-local:
    name: Local compose Playwright e2e
    needs: [test-backend, test-frontend, test-infra]
    if: inputs.run_e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Bring up the local stack (+ frontend)
        run: |
          make up
          make ui

      # `chrome` as well as `chromium`: Playwright's bundled Chromium omits
      # proprietary media codecs, and MP3 sits in the grey zone across
      # versions. The playback project must not be the place a codec gap
      # silently turns a real assertion into a skip (OQ-7) -- playback.spec.ts
      # hard-fails on an empty canPlayType("audio/mpeg").
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium chrome

      - name: Run the Playwright suite (with the playback project)
        working-directory: frontend
        run: npm run test:e2e:local

      - name: Upload the trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: make down
