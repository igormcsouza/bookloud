name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      backend_or_infra_changed:
        description: "true if this push/PR touches backend/, infra/, local/, docker-compose*.yml, Makefile, or a deploy-pipeline workflow file"
        value: ${{ jobs.changes.outputs.backend_or_infra }}
      mobile_changed:
        value: ${{ jobs.changes.outputs.mobile }}

jobs:
  # Mobile ships through its own release-triggered pipeline
  # (mobile-release.yml), entirely separate from the AWS stack -- so a
  # mobile-only change has no business running backend tests, infra synth,
  # the local compose smoke test, or (per deploy-prod.yml) a full CDK
  # deploy+teardown. Conversely a backend/infra-only change has no business
  # running the mobile suite. Detected once here so every caller (this
  # file's own jobs, plus deploy-prod.yml gating its deploy jobs) shares one
  # answer instead of re-deriving it and risking drift.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend_or_infra: ${{ steps.filter.outputs.backend_or_infra }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_or_infra:
              - 'backend/**'
              - 'infra/**'
              - 'local/**'
              - 'docker-compose*.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-prod.yml'
              - '.github/workflows/deploy-stack.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/mobile-release.yml'

  test-backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend_or_infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies (including dev group)
        working-directory: backend
        run: uv sync --group dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest --tb=short

  test-mobile:
    name: Mobile app tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Run tests
        working-directory: mobile
        run: npm test

  test-infra:
    name: Infra tests + synth
    needs: changes
    if: needs.changes.outputs.backend_or_infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('infra/requirements.txt', 'infra/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CDK Python dependencies
        working-directory: infra
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run infra unit tests
        working-directory: infra
        run: pytest tests

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Belt-and-braces synth check
        working-directory: infra
        run: cdk synth -c environment=pr-0 -q
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1

  # Issue #10: this used to also bring up the local compose stack's `frontend`
  # service and run the full Playwright suite (with the playback project)
  # against it -- gone along with the frontend itself. A mobile e2e
  # replacement (Detox/Maestro) is an explicitly deferred follow-up; until
  # then, the backend-only smoke test below is local CI's only end-to-end
  # check.
  local-smoke:
    name: Local compose smoke test
    # Backend-only (`make up`/`make smoke` never touch mobile/) -- test-mobile
    # is deliberately not a dependency, so a mobile-only push (where
    # test-mobile is the only job that ran) doesn't skip this one too.
    needs: [changes, test-backend, test-infra]
    if: needs.changes.outputs.backend_or_infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bring up the local stack
        run: make up

      - name: Run the smoke test
        run: make smoke

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: make down
