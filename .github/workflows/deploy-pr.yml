name: Deploy PR Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: false # queue, never race, cdk deploy against one stack

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy PR Environment
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.frontend-url.outputs.url }}
    env:
      ENV_NAME: pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('infra/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK Python dependencies
        working-directory: infra
        run: pip install -r requirements.txt

      - name: Bootstrap CDK
        working-directory: infra
        run: cdk bootstrap "aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ secrets.AWS_REGION }}"

      # --exclusively is load-bearing: without it, naming BookloudApi-* would
      # drag its dependencies in with whatever context the *next* command
      # supplies.
      - name: Deploy Storage, Auth, Pipeline, Api
        id: deploy-backend
        working-directory: infra
        run: |
          cdk deploy \
            "BookloudStorage-${ENV_NAME}" "BookloudAuth-${ENV_NAME}" \
            "BookloudPipeline-${ENV_NAME}" "BookloudApi-${ENV_NAME}" \
            --exclusively \
            --require-approval never \
            -c environment="${ENV_NAME}" \
            -c git_sha="${GITHUB_SHA}" \
            --outputs-file cdk-backend-outputs.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open("cdk-backend-outputs.json") as f:
              outputs = json.load(f)
          env_name = os.environ["ENV_NAME"]
          api = outputs.get(f"BookloudApi-{env_name}", {})
          auth = outputs.get(f"BookloudAuth-{env_name}", {})
          print(f"api_url={api.get('ApiUrl', '').rstrip('/')}")
          print(f"user_pool_id={auth.get('UserPoolId', '')}")
          print(f"user_pool_client_id={auth.get('UserPoolClientId', '')}")
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (OpenNext)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.deploy-backend.outputs.api_url }}
        run: npx open-next build

      - name: Verify OpenNext output
        working-directory: frontend
        run: |
          if [ ! -d ".open-next/server-functions/default" ]; then
            echo "ERROR: OpenNext did not produce .open-next/server-functions/default/"
            echo "Contents of .open-next/ (if it exists):"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next/ does not exist"
            exit 1
          fi
          echo "OpenNext output OK: $(du -sh .open-next/server-functions/default | cut -f1) in server-functions/default/"

      - name: Deploy Frontend
        id: deploy-frontend
        working-directory: infra
        run: |
          rm -rf cdk.out
          cdk deploy \
            "BookloudFrontend-${ENV_NAME}" \
            --exclusively \
            --require-approval never \
            -c environment="${ENV_NAME}" \
            -c git_sha="${GITHUB_SHA}" \
            --outputs-file cdk-frontend-outputs.json

      - name: Extract frontend URL
        id: frontend-url
        working-directory: infra
        run: |
          FRONTEND_URL=$(python3 - <<'PY'
          import json, os
          with open("cdk-frontend-outputs.json") as f:
              outputs = json.load(f)
          env_name = os.environ["ENV_NAME"]
          stack = outputs.get(f"BookloudFrontend-{env_name}", {})
          print(stack.get("FrontendUrl", "").rstrip("/"))
          PY
          )
          echo "url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the ephemeral deploy
        run: |
          python3 local/smoke_test.py \
            --api-url "${{ steps.deploy-backend.outputs.api_url }}" \
            --frontend-url "${{ steps.frontend-url.outputs.url }}" \
            --expect-commit "${{ github.sha }}" \
            --expect-environment "${{ env.ENV_NAME }}"

      - name: Comment on PR with deployment URLs
        uses: actions/github-script@v9
        with:
          script: |
            const apiUrl      = '${{ steps.deploy-backend.outputs.api_url }}';
            const frontendUrl = '${{ steps.frontend-url.outputs.url }}';
            const envName     = 'pr-${{ github.event.pull_request.number }}';
            const sha         = context.sha.slice(0, 7);

            const marker = '<!-- bookloud-pr-env-comment -->';
            const body = [
              marker,
              '## Deploy: PR environment ready',
              '',
              `Environment: \`${envName}\``,
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| Frontend | ${frontendUrl} |`,
              `| API | ${apiUrl} |`,
              '',
              `Deployed from commit \`${sha}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
