name: Deploy PR Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: false # queue, never race, cdk deploy against one stack

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      # The full docker-compose e2e suite (with the playback project) is
      # main-only -- expensive to run on every commit, and this PR's `deploy`
      # job below already runs its own Playwright pass (chromium only)
      # against the real ephemeral deploy.
      run_e2e: false

  # Phase 8 (IMPLEMENTATION_PLAN.md): the deploy-and-smoke-test-and-e2e
  # sequence now lives in deploy-stack.yml so deploy-prod.yml's staging gate
  # can reuse it byte-for-byte instead of drifting from this one.
  deploy:
    name: Deploy PR Environment
    needs: ci
    uses: ./.github/workflows/deploy-stack.yml
    with:
      env_name: pr-${{ github.event.pull_request.number }}
      aws_region: "us-east-1"  # PR/staging: keep off prod's sa-east-1 quota, issue #8
      environment_name: development
      seed_users: true
      run_e2e: true
    secrets: inherit

  comment:
    name: Comment on PR
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Comment on PR with deployment URLs
        uses: actions/github-script@v9
        with:
          script: |
            const apiUrl      = '${{ needs.deploy.outputs.api_url }}';
            const frontendUrl = '${{ needs.deploy.outputs.frontend_url }}';
            const envName     = 'pr-${{ github.event.pull_request.number }}';
            const sha         = context.sha.slice(0, 7);

            const marker = '<!-- bookloud-pr-env-comment -->';
            const body = [
              marker,
              '## Deploy: PR environment ready',
              '',
              `Environment: \`${envName}\``,
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| Frontend | ${frontendUrl} |`,
              `| API | ${apiUrl} |`,
              '',
              'Login: `admin` / `password`',
              '',
              `Deployed from commit \`${sha}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
