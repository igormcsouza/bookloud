name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# Only one production environment: rapid pushes to main queue behind each
# other instead of racing concurrent `cdk deploy` calls against the same
# stacks. An in-flight deploy is never cancelled -- killing one mid-update
# can leave a stack rolled back or stuck.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      # Merges to main are the one place the full docker-compose e2e suite
      # (playback project included) runs -- not every PR commit.
      run_e2e: true

  # Phase 8 (IMPLEMENTATION_PLAN.md): "on merge to main, unit tests -> e2e
  # against a staging/prod-like ephemeral stack -> CDK deploy to prod". This
  # job deploys a genuinely ephemeral `Bookloud*-staging` stack set (same CDK
  # code, same OpenNext build, same Cognito/API Gateway/CloudFront wiring as
  # prod) and runs the Playwright chromium project against it. `staging` is
  # not "prod", so get_speech_synthesizer()/get_chat_model() gate to their
  # stubs exactly like a pr-N environment does -- degraded.spec.ts's
  # PARTIAL/NO_AUDIO assertions are meaningful here, and nothing here touches
  # real TTS quota or the real Cognito pool.
  staging:
    name: Staging (ephemeral e2e gate)
    needs: ci
    uses: ./.github/workflows/deploy-stack.yml
    with:
      env_name: staging
      aws_region: ${{ secrets.AWS_REGION }}
      environment_name: development
      seed_users: true
      run_e2e: true
    secrets: inherit

  # Always attempted once `staging` has run (success or failure) so a failed
  # e2e gate never strands a live staging stack. Mirrors destroy-pr.yml:
  # plain CloudFormation deletes in reverse dependency order, with the same
  # bounded DELETE_FAILED retry for the known-transient
  # AWS::ApiGatewayV2::Authorizer InternalFailure on delete (see
  # destroy-pr.yml for the full incident writeup).
  destroy-staging:
    name: Destroy staging
    needs: staging
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development
    env:
      ENV_NAME: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # destroy-staging deletes the ephemeral staging stack, which lives in
      # the shared AWS_REGION (us-east-1) same as PR environments -- only
      # the final prod `deploy` job below uses AWS_REGION_PROD (sa-east-1,
      # issue #8).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Delete stacks (reverse dependency order)
        run: |
          set -euo pipefail

          BACKOFFS=(60 180 300)
          RETRY_BUDGET_SECONDS=900
          RETRY_SPENT=0

          stack_status() {
            aws cloudformation describe-stacks --stack-name "$1" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "GONE"
          }

          delete_with_retry() {
            local STACK="$1" ATTEMPT=0 STATUS
            while :; do
              aws cloudformation delete-stack --stack-name "$STACK"
              if aws cloudformation wait stack-delete-complete --stack-name "$STACK"; then
                echo "$STACK deleted."
                return 0
              fi

              STATUS=$(stack_status "$STACK")
              if [ "$STATUS" = "GONE" ]; then
                echo "$STACK is gone."
                return 0
              fi
              if [ "$STATUS" != "DELETE_FAILED" ]; then
                echo "::error::$STACK is in $STATUS, not DELETE_FAILED - not retrying." >&2
                aws cloudformation describe-stack-events --stack-name "$STACK" \
                  --max-items 20 --output table >&2 || true
                return 1
              fi

              if [ "$ATTEMPT" -ge "${#BACKOFFS[@]}" ]; then
                echo "::error::$STACK is still DELETE_FAILED after ${#BACKOFFS[@]} retries." >&2
                echo "::error::This is the KNOWN TRANSIENT AWS::ApiGatewayV2::Authorizer 'InternalFailure' on delete (see destroy-pr.yml). The stack is STILL STANDING and is leaking resources." >&2
                echo "::error::WHAT TO DO: re-run this job later (Actions -> Deploy to Production -> Re-run jobs). If it still fails after several hours, delete BookloudApi-${ENV_NAME} by hand with elevated credentials." >&2
                aws cloudformation describe-stack-events --stack-name "$STACK" \
                  --max-items 20 --output table >&2 || true
                return 1
              fi

              local SLEEP="${BACKOFFS[$ATTEMPT]}"
              if [ "$((RETRY_SPENT + SLEEP))" -gt "$RETRY_BUDGET_SECONDS" ]; then
                echo "::error::$STACK is DELETE_FAILED and the ${RETRY_BUDGET_SECONDS}s retry budget for this job is exhausted." >&2
                echo "::error::This is the KNOWN TRANSIENT AWS::ApiGatewayV2::Authorizer 'InternalFailure' on delete. The stack is STILL STANDING. Re-run this job later." >&2
                return 1
              fi
              RETRY_SPENT=$((RETRY_SPENT + SLEEP))
              ATTEMPT=$((ATTEMPT + 1))
              echo "$STACK is DELETE_FAILED (the known transient authorizer InternalFailure)."
              echo "Retry $ATTEMPT/${#BACKOFFS[@]} in ${SLEEP}s (${RETRY_SPENT}s of ${RETRY_BUDGET_SECONDS}s budget used)..."
              sleep "$SLEEP"
            done
          }

          for STACK in "BookloudFrontend-${ENV_NAME}" \
                       "BookloudApi-${ENV_NAME}" \
                       "BookloudPipeline-${ENV_NAME}" \
                       "BookloudAuth-${ENV_NAME}" \
                       "BookloudStorage-${ENV_NAME}"; do
            if ERR=$(aws cloudformation describe-stacks --stack-name "$STACK" 2>&1 1>/dev/null); then
              echo "Deleting $STACK..."
              delete_with_retry "$STACK"
            elif echo "$ERR" | grep -q "does not exist"; then
              echo "$STACK does not exist - skipping."
            else
              echo "ERROR describing $STACK: $ERR" >&2
              exit 1
            fi
          done

  # Byte-for-byte the same deploy-stack.yml call as `staging` above, minus
  # user seeding and e2e: prod already got its e2e gate against the staging
  # stack, and per IMPLEMENTATION_PLAN.md real TTS engines are prod-only, so
  # there is deliberately no reason to run login-gated checks or Playwright
  # against the real Cognito pool here. Gated on `staging` succeeding --
  # `needs: staging` alone isn't enough since a failed dependency still lets
  # a job with `if: always()` run, but this job has no `if:`, so the default
  # (only run if every need succeeded) applies and a failed e2e gate blocks
  # the prod deploy outright.
  deploy:
    name: Deploy Production
    needs: [ci, staging]
    uses: ./.github/workflows/deploy-stack.yml
    with:
      env_name: prod
      aws_region: ${{ secrets.AWS_REGION_PROD }}
      environment_name: production
      seed_users: false
      run_e2e: false
    secrets: inherit
