name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

# Only one production environment: rapid pushes to main queue behind each
# other instead of racing concurrent `cdk deploy` calls against the same
# stacks. An in-flight deploy is never cancelled -- killing one mid-update
# can leave a stack rolled back or stuck.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Production
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.frontend-url.outputs.url }}
    env:
      ENV_NAME: prod

    # Byte-for-byte the same step sequence as deploy-pr.yml's deploy job,
    # with ENV_NAME=prod, minus the PR-comment step. No Playwright e2e yet --
    # per IMPLEMENTATION_PLAN.md there is no UI flow to test until phase 8;
    # the smoke test is the gate. Kept structurally identical to
    # deploy-pr.yml on purpose so phase 8 can factor both into one reusable
    # deploy.yml without a rewrite -- do not factor it now, the duplication
    # is deliberate and cheap at this size.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('infra/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK Python dependencies
        working-directory: infra
        run: pip install -r requirements.txt

      - name: Bootstrap CDK
        working-directory: infra
        run: cdk bootstrap "aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ secrets.AWS_REGION }}"

      - name: Deploy Storage, Auth, Pipeline, Api
        id: deploy-backend
        working-directory: infra
        run: |
          cdk deploy \
            "BookloudStorage-${ENV_NAME}" "BookloudAuth-${ENV_NAME}" \
            "BookloudPipeline-${ENV_NAME}" "BookloudApi-${ENV_NAME}" \
            --exclusively \
            --require-approval never \
            -c environment="${ENV_NAME}" \
            -c git_sha="${GITHUB_SHA}" \
            --outputs-file cdk-backend-outputs.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("cdk-backend-outputs.json") as f:
              outputs = json.load(f)
          api = outputs.get("BookloudApi-prod", {})
          print(f"api_url={api.get('ApiUrl', '').rstrip('/')}")
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (OpenNext)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ steps.deploy-backend.outputs.api_url }}
        run: npx open-next build

      - name: Verify OpenNext output
        working-directory: frontend
        run: |
          if [ ! -d ".open-next/server-functions/default" ]; then
            echo "ERROR: OpenNext did not produce .open-next/server-functions/default/"
            echo "Contents of .open-next/ (if it exists):"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next/ does not exist"
            exit 1
          fi
          echo "OpenNext output OK: $(du -sh .open-next/server-functions/default | cut -f1) in server-functions/default/"

      - name: Deploy Frontend
        working-directory: infra
        run: |
          rm -rf cdk.out
          cdk deploy \
            "BookloudFrontend-${ENV_NAME}" \
            --exclusively \
            --require-approval never \
            -c environment="${ENV_NAME}" \
            -c git_sha="${GITHUB_SHA}" \
            --outputs-file cdk-frontend-outputs.json

      - name: Extract frontend URL
        id: frontend-url
        working-directory: infra
        run: |
          FRONTEND_URL=$(python3 - <<'PY'
          import json
          with open("cdk-frontend-outputs.json") as f:
              outputs = json.load(f)
          stack = outputs.get("BookloudFrontend-prod", {})
          print(stack.get("FrontendUrl", "").rstrip("/"))
          PY
          )
          echo "url=${FRONTEND_URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test prod
        run: |
          python3 local/smoke_test.py \
            --api-url "${{ steps.deploy-backend.outputs.api_url }}" \
            --frontend-url "${{ steps.frontend-url.outputs.url }}" \
            --expect-commit "${{ github.sha }}" \
            --expect-environment prod
